display_information:
  name: Hermes
  description: Administración controlada de servidores desde Slack
  background_color: "#243447"
features:
  bot_user:
    display_name: Hermes
    always_online: false
  slash_commands:
    - command: /hermes
      description: Administra servidores autorizados con Hermes
      usage_hint: ayuda
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
